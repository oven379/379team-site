server {
    listen 80 default_server;
    server_name itcompania.ru www.itcompania.ru;
    root /usr/share/nginx/html;
    index index.html;

    # Редиректы собираем относительными: за прокси nginx не знает внешний порт и схему
    absolute_redirect off;

    # www.itcompania.ru → itcompania.ru (одна версия сайта для поисковиков)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Сжатие текстовых файлов
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Скрытые файлы и папки (.git, .DS_Store и т. п.) наружу не отдаём
    location ~ /\. {
        return 404;
    }

    # Картинки и шрифты меняются редко — кэш на 30 дней
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Страницы — всегда проверять свежесть, чтобы правки были видны сразу
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
